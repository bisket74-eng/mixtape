<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mixtape</title>
<link rel="manifest" href="data:application/manifest+json,{%22name%22:%22Mixtape%22,%22short_name%22:%22Mixtape%22,%22display%22:%22standalone%22,%22background_color%22:%22%232a1c10%22,%22theme_color%22:%22%233d2817%22}">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Special+Elite&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --shell-dark:#2a1c10;
    --shell:#4a3218;
    --shell-light:#5c4020;
    --label-paper:#ece1c8;
    --label-shadow:#d8c9a3;
    --tan:#c9a876;
    --ink:#2b2016;
    --rust:#c1502e;
    --rust-dark:#9a3d22;
    --well:#141009;
    --well-edge:#0a0806;
    --cream:#f4ecd8;
    --muted:#8a7860;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse at 50% -10%, #3a2a18 0%, transparent 60%),
      linear-gradient(180deg,#1c140c 0%, #14100a 100%);
    font-family:'Work Sans', sans-serif;
    color:var(--cream);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:20px 14px 40px;
    overflow-x:hidden;
  }

  /* ---------- top bar ---------- */
  .topbar{
    width:100%;
    max-width:420px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
  }
  .brand{
    font-family:'Special Elite', monospace;
    font-size:14px;
    letter-spacing:1px;
    color:var(--tan);
  }
  .icon-btn{
    background:none;
    border:1px solid #5c4020;
    color:var(--tan);
    width:34px;height:34px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:16px;
    cursor:pointer;
  }
  .icon-btn:active{transform:scale(0.92);}

  /* ---------- login card ---------- */
  .login-card{
    max-width:380px;
    width:100%;
    background:var(--shell);
    border:1px solid #63432280;
    border-radius:14px;
    padding:28px 22px;
    text-align:center;
    margin-top:40px;
  }
  .login-card h1{
    font-family:'Special Elite', monospace;
    font-size:20px;
    color:var(--cream);
    margin:0 0 8px;
  }
  .login-card p{
    color:var(--muted);
    font-size:14px;
    line-height:1.5;
    margin:0 0 20px;
  }
  .spotify-btn{
    background:#1DB954;
    color:#0a1a0d;
    border:none;
    padding:13px 24px;
    border-radius:24px;
    font-weight:600;
    font-size:15px;
    cursor:pointer;
    width:100%;
  }
  .spotify-btn:active{transform:scale(0.98);}
  .settings-toggle{
    margin-top:16px;
    background:none;
    border:none;
    color:var(--muted);
    font-size:12px;
    text-decoration:underline;
    cursor:pointer;
  }
  .settings-box{
    margin-top:14px;
    text-align:left;
    display:none;
  }
  .settings-box.open{display:block;}
  .settings-box label{
    display:block;
    font-size:11px;
    color:var(--muted);
    margin:10px 0 4px;
  }
  .settings-box input{
    width:100%;
    background:var(--well);
    border:1px solid #5c4020;
    color:var(--cream);
    padding:9px 10px;
    border-radius:8px;
    font-size:13px;
  }
  .settings-box .save-settings{
    margin-top:12px;
    background:var(--rust);
    color:var(--cream);
    border:none;
    padding:9px 16px;
    border-radius:8px;
    font-size:13px;
    cursor:pointer;
    width:100%;
  }
  .redirect-hint{
    font-size:10.5px;
    color:var(--muted);
    margin-top:6px;
    word-break:break-all;
  }

  /* ---------- app ---------- */
  #app{display:none; width:100%; max-width:420px; flex-direction:column; align-items:center;}
  #app.open{display:flex;}

  /* ---------- cassette ---------- */
  .cassette-wrap{
    width:100%;
    perspective:800px;
  }
  .cassette{
    position:relative;
    width:100%;
    aspect-ratio: 620 / 400;
    background:
      linear-gradient(160deg, var(--shell-light) 0%, var(--shell) 45%, var(--shell-dark) 100%);
    border-radius:16px;
    box-shadow:
      0 18px 30px -12px rgba(0,0,0,0.6),
      inset 0 1px 0 rgba(255,255,255,0.06);
    padding:5.5% 6%;
    display:flex;
    flex-direction:column;
  }
  .cassette::before{ /* screw details */
    content:'';
    position:absolute;
    inset:0;
    pointer-events:none;
    background:
      radial-gradient(circle at 8% 8%, #00000055 0 3px, transparent 4px),
      radial-gradient(circle at 92% 8%, #00000055 0 3px, transparent 4px),
      radial-gradient(circle at 8% 92%, #00000055 0 3px, transparent 4px),
      radial-gradient(circle at 92% 92%, #00000055 0 3px, transparent 4px);
  }

  .label-paper{
    position:relative;
    background:
      linear-gradient(180deg, var(--label-paper) 0%, var(--label-shadow) 100%);
    border-radius:6px;
    flex:1 1 62%;
    padding:4% 5% 3%;
    box-shadow: inset 0 0 0 1px #b8a578, inset 0 -3px 6px -2px #00000022;
    display:flex;
    flex-direction:column;
  }
  .label-top-row{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:8px;
  }
  .tape-brand{
    font-family:'Special Elite', monospace;
    font-size:clamp(8px,2.4vw,11px);
    color:#8a7050;
    letter-spacing:1.5px;
  }
  .tape-type{
    font-family:'Special Elite', monospace;
    font-size:clamp(7px,2vw,9px);
    color:#a89264;
    border:1px solid #a89264;
    border-radius:3px;
    padding:1px 5px;
  }

  .handwritten-input{
    flex:1;
    width:100%;
    background:none;
    border:none;
    resize:none;
    outline:none;
    font-family:'Caveat', cursive;
    color:#2b2016;
    font-size:clamp(22px,7vw,34px);
    line-height:1.15;
    padding:2% 0 0;
    text-align:center;
  }
  .handwritten-input::placeholder{
    color:#8a7860;
    opacity:0.65;
  }

  .label-lines{
    position:absolute;
    left:5%; right:5%; bottom:8%;
    height:1px;
    background-image: linear-gradient(90deg, #b8a578 60%, transparent 0);
    background-size: 8px 1px;
    background-repeat: repeat-x;
    opacity:0.6;
  }

  /* reel window */
  .reel-window{
    flex:1 1 38%;
    margin-top:4%;
    background:
      linear-gradient(180deg, #1c130a 0%, var(--well) 100%);
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 8%;
    box-shadow: inset 0 2px 8px rgba(0,0,0,0.7), inset 0 0 0 1px var(--well-edge);
    position:relative;
  }
  .reel-window::before{
    content:'';
    position:absolute;
    left:50%; top:50%;
    transform:translate(-50%,-50%);
    width:70%; height:3px;
    background:repeating-linear-gradient(90deg, #d8c9a355 0 3px, transparent 3px 6px);
  }
  .reel{
    width:22%;
    aspect-ratio:1;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #4a3220, #1a1006 70%);
    position:relative;
    box-shadow: 0 0 0 2px #0a0603, inset 0 0 6px rgba(0,0,0,0.8);
  }
  .reel::before{
    content:'';
    position:absolute; inset:30%;
    border-radius:50%;
    background:#0a0603;
    box-shadow: inset 0 0 0 2px #3a2818;
  }
  .reel::after{
    content:'';
    position:absolute; inset:0;
    border-radius:50%;
    background-image:
      linear-gradient(0deg, transparent 46%, #6b4a2a 46% 54%, transparent 54%),
      linear-gradient(60deg, transparent 46%, #6b4a2a 46% 54%, transparent 54%),
      linear-gradient(120deg, transparent 46%, #6b4a2a 46% 54%, transparent 54%);
    opacity:0.5;
  }
  .reel.spin{ animation: spin-reel 2.2s linear infinite; }
  @keyframes spin-reel{ to{ transform:rotate(360deg); } }

  .counter-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:3.5%;
  }
  .counter{
    font-family:'Special Elite', monospace;
    background:#0e0a06;
    color:#e8b87a;
    padding:3px 8px;
    border-radius:4px;
    font-size:clamp(11px,2.8vw,14px);
    letter-spacing:1px;
    box-shadow: inset 0 0 4px rgba(0,0,0,0.8);
  }
  .side-tag{
    font-family:'Special Elite', monospace;
    font-size:clamp(9px,2.4vw,11px);
    color:#d8c9a3aa;
  }

  /* ---------- now playing ---------- */
  .now-playing{
    width:100%;
    margin-top:16px;
    min-height:40px;
    text-align:center;
    font-size:13px;
    color:var(--tan);
  }
  .now-playing .track-name{ color:var(--cream); font-weight:600; }

  /* ---------- deck controls ---------- */
  .deck{
    width:100%;
    margin-top:14px;
    background:var(--shell-dark);
    border-radius:14px;
    padding:16px 14px;
    display:flex;
    gap:10px;
    justify-content:center;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 10px 20px -12px rgba(0,0,0,0.6);
  }
  .deck-btn{
    flex:1;
    max-width:64px;
    aspect-ratio:1;
    border-radius:50%;
    border:1px solid #00000055;
    background: linear-gradient(160deg, #6b4a28, #3d2817);
    color:var(--cream);
    font-size:18px;
    display:flex;align-items:center;justify-content:center;
    box-shadow: 0 3px 0 #221709, 0 5px 8px rgba(0,0,0,0.5);
    cursor:pointer;
  }
  .deck-btn:active{
    transform:translateY(2px);
    box-shadow: 0 1px 0 #221709, 0 2px 4px rgba(0,0,0,0.5);
  }
  .deck-btn.record{
    background: linear-gradient(160deg, var(--rust), var(--rust-dark));
  }
  .deck-btn.record.active{
    animation: pulse-rec 1s infinite;
  }
  @keyframes pulse-rec{
    0%,100%{ box-shadow: 0 3px 0 #221709, 0 5px 8px rgba(0,0,0,0.5), 0 0 0 0 #c1502e66; }
    50%{ box-shadow: 0 3px 0 #221709, 0 5px 8px rgba(0,0,0,0.5), 0 0 0 8px #c1502e00; }
  }
  .deck-btn:disabled{ opacity:0.35; cursor:default; }

  /* ---------- tracklist ---------- */
  .tracklist{
    width:100%;
    margin-top:18px;
  }
  .tracklist-title{
    font-family:'Special Elite', monospace;
    font-size:12px;
    color:var(--muted);
    letter-spacing:0.5px;
    margin-bottom:8px;
    padding-left:2px;
  }
  .track-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 8px;
    border-bottom:1px solid #3a281680;
  }
  .track-num{
    font-family:'Special Elite', monospace;
    color:var(--muted);
    font-size:12px;
    width:18px;
    flex-shrink:0;
  }
  .track-info{ flex:1; min-width:0; }
  .track-title{
    font-size:13.5px;
    color:var(--cream);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .track-artist{
    font-size:11.5px;
    color:var(--muted);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .track-remove{
    background:none;
    border:none;
    color:var(--muted);
    font-size:16px;
    cursor:pointer;
    padding:4px 8px;
  }
  .empty-tape{
    text-align:center;
    color:var(--muted);
    font-size:13px;
    padding:24px 10px;
    line-height:1.6;
  }

  /* ---------- search sheet ---------- */
  .sheet-backdrop{
    position:fixed; inset:0;
    background:rgba(10,7,4,0.7);
    display:none;
    align-items:flex-end;
    z-index:50;
  }
  .sheet-backdrop.open{display:flex;}
  .sheet{
    width:100%;
    max-height:78vh;
    background:#241809;
    border-radius:18px 18px 0 0;
    padding:16px 16px calc(16px + env(safe-area-inset-bottom));
    display:flex;
    flex-direction:column;
    box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
  }
  .sheet-handle{
    width:36px; height:4px;
    background:#5c4020;
    border-radius:2px;
    margin:0 auto 12px;
  }
  .sheet h2{
    font-family:'Special Elite', monospace;
    font-size:15px;
    margin:0 0 10px;
    color:var(--cream);
  }
  .search-input{
    width:100%;
    background:var(--well);
    border:1px solid #5c4020;
    color:var(--cream);
    padding:11px 12px;
    border-radius:10px;
    font-size:15px;
    margin-bottom:10px;
  }
  .search-results{
    overflow-y:auto;
    flex:1;
  }
  .result-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 4px;
    border-bottom:1px solid #3a281680;
  }
  .result-row img{
    width:42px; height:42px;
    border-radius:5px;
    flex-shrink:0;
    background:#3a2816;
  }
  .result-info{ flex:1; min-width:0; }
  .result-title{
    font-size:13.5px; color:var(--cream);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .result-artist{
    font-size:11.5px; color:var(--muted);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .add-btn{
    background:var(--rust);
    color:var(--cream);
    border:none;
    width:30px;height:30px;
    border-radius:50%;
    font-size:16px;
    flex-shrink:0;
    cursor:pointer;
  }
  .sheet-close{
    background:none;
    border:1px solid #5c4020;
    color:var(--tan);
    padding:10px;
    border-radius:10px;
    font-size:13px;
    margin-top:10px;
    cursor:pointer;
  }
  .hint{
    text-align:center;
    color:var(--muted);
    font-size:11px;
    margin-top:8px;
  }
</style>
</head>
<body>

  <div class="topbar">
    <div class="brand">◆ MIXTAPE</div>
    <button class="icon-btn" id="settingsGear" title="Settings">⚙</button>
  </div>

  <!-- LOGIN -->
  <div class="login-card" id="loginCard">
    <h1>Press Record</h1>
    <p>Sign in with Spotify to build a tape, drag songs on like you're taping them off the radio.</p>
    <button class="spotify-btn" id="loginBtn">Connect Spotify</button>
    <button class="settings-toggle" id="settingsToggle">Spotify app settings</button>
    <div class="settings-box" id="settingsBox">
      <label>Client ID</label>
      <input type="text" id="clientIdInput" placeholder="paste your Spotify Client ID">
      <div class="redirect-hint" id="redirectHint"></div>
      <button class="save-settings" id="saveSettings">Save</button>
    </div>
  </div>

  <!-- APP -->
  <div id="app">
    <div class="cassette-wrap">
      <div class="cassette">
        <div class="label-paper">
          <div class="label-top-row">
            <span class="tape-brand">TYPE I · NORMAL</span>
            <span class="tape-type">60 MIN</span>
          </div>
          <textarea class="handwritten-input" id="tapeTitle" placeholder="write something on the label..." maxlength="60" rows="2"></textarea>
          <div class="label-lines"></div>
        </div>
        <div class="reel-window">
          <div class="reel" id="reelLeft"></div>
          <div class="reel" id="reelRight"></div>
        </div>
        <div class="counter-row">
          <span class="counter" id="counter">000</span>
          <span class="side-tag">SIDE A</span>
        </div>
      </div>
    </div>

    <div class="now-playing" id="nowPlaying">nothing recorded yet</div>

    <div class="deck">
      <button class="deck-btn" id="rewindBtn" title="Previous">⏮</button>
      <button class="deck-btn" id="playBtn" title="Play/Pause">▶</button>
      <button class="deck-btn" id="ffBtn" title="Next">⏭</button>
      <button class="deck-btn record" id="recordBtn" title="Record a song">●</button>
    </div>
    <div class="hint">tap ● to find a song and record it onto the tape</div>

    <div class="tracklist">
      <div class="tracklist-title">TRACKLIST</div>
      <div id="trackList"></div>
    </div>
  </div>

  <!-- SEARCH SHEET -->
  <div class="sheet-backdrop" id="sheetBackdrop">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <h2>Find a song to record</h2>
      <input type="text" class="search-input" id="searchInput" placeholder="song or artist...">
      <div class="search-results" id="searchResults"></div>
      <button class="sheet-close" id="sheetClose">Close</button>
    </div>
  </div>

<script>
(function(){
  "use strict";

  /* ---------------- config / storage ---------------- */
  const LS_CLIENT_ID = "mixtape_spotify_client_id";
  const LS_VERIFIER = "mixtape_pkce_verifier";
  const LS_TOKEN = "mixtape_token";
  const LS_REFRESH = "mixtape_refresh";
  const LS_EXPIRES = "mixtape_expires";
  const LS_TITLE = "mixtape_title";
  const LS_TRACKS = "mixtape_tracks";
  const LS_PLAYLIST_ID = "mixtape_playlist_id";

  const REDIRECT_URI = window.location.origin + window.location.pathname;
  const SCOPES = [
    "streaming",
    "user-read-email",
    "user-read-private",
    "user-read-playback-state",
    "user-modify-playback-state",
    "playlist-modify-public",
    "playlist-modify-private"
  ].join(" ");

  document.getElementById("redirectHint").textContent = "Redirect URI to register in Spotify: " + REDIRECT_URI;

  function getClientId(){ return localStorage.getItem(LS_CLIENT_ID) || ""; }

  /* ---------------- settings UI ---------------- */
  const settingsBox = document.getElementById("settingsBox");
  document.getElementById("settingsToggle").addEventListener("click", ()=>{
    settingsBox.classList.toggle("open");
    document.getElementById("clientIdInput").value = getClientId();
  });
  document.getElementById("settingsGear").addEventListener("click", ()=>{
    document.getElementById("loginCard").style.display = "block";
    document.getElementById("app").classList.remove("open");
    settingsBox.classList.add("open");
    document.getElementById("clientIdInput").value = getClientId();
  });
  document.getElementById("saveSettings").addEventListener("click", ()=>{
    const val = document.getElementById("clientIdInput").value.trim();
    if(val){ localStorage.setItem(LS_CLIENT_ID, val); }
    settingsBox.classList.remove("open");
    alert("Saved. Tap Connect Spotify to sign in.");
  });

  /* ---------------- PKCE helpers ---------------- */
  function randomString(len){
    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
    let out = "";
    const rnd = new Uint8Array(len);
    crypto.getRandomValues(rnd);
    for(let i=0;i<len;i++){ out += chars[rnd[i] % chars.length]; }
    return out;
  }
  async function sha256base64url(str){
    const enc = new TextEncoder().encode(str);
    const digest = await crypto.subtle.digest("SHA-256", enc);
    let bin = "";
    const bytes = new Uint8Array(digest);
    for(let i=0;i<bytes.length;i++){ bin += String.fromCharCode(bytes[i]); }
    return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
  }

  async function startLogin(){
    const clientId = getClientId();
    if(!clientId){
      settingsBox.classList.add("open");
      document.getElementById("clientIdInput").value = "";
      alert("Add your Spotify Client ID first (tap 'Spotify app settings' below).");
      return;
    }
    const verifier = randomString(64);
    localStorage.setItem(LS_VERIFIER, verifier);
    const challenge = await sha256base64url(verifier);
    const params = new URLSearchParams({
      client_id: clientId,
      response_type: "code",
      redirect_uri: REDIRECT_URI,
      code_challenge_method: "S256",
      code_challenge: challenge,
      scope: SCOPES
    });
    window.location.href = "https://accounts.spotify.com/authorize?" + params.toString();
  }
  document.getElementById("loginBtn").addEventListener("click", startLogin);

  async function exchangeCodeForToken(code){
    const clientId = getClientId();
    const verifier = localStorage.getItem(LS_VERIFIER);
    const body = new URLSearchParams({
      client_id: clientId,
      grant_type: "authorization_code",
      code: code,
      redirect_uri: REDIRECT_URI,
      code_verifier: verifier
    });
    const res = await fetch("https://accounts.spotify.com/api/token", {
      method: "POST",
      headers: {"Content-Type":"application/x-www-form-urlencoded"},
      body: body.toString()
    });
    if(!res.ok){ throw new Error("token exchange failed"); }
    const data = await res.json();
    saveTokens(data);
  }

  async function refreshToken(){
    const clientId = getClientId();
    const refresh = localStorage.getItem(LS_REFRESH);
    if(!refresh) return false;
    const body = new URLSearchParams({
      client_id: clientId,
      grant_type: "refresh_token",
      refresh_token: refresh
    });
    const res = await fetch("https://accounts.spotify.com/api/token", {
      method: "POST",
      headers: {"Content-Type":"application/x-www-form-urlencoded"},
      body: body.toString()
    });
    if(!res.ok){ return false; }
    const data = await res.json();
    saveTokens(data);
    return true;
  }

  function saveTokens(data){
    localStorage.setItem(LS_TOKEN, data.access_token);
    if(data.refresh_token){ localStorage.setItem(LS_REFRESH, data.refresh_token); }
    localStorage.setItem(LS_EXPIRES, String(Date.now() + (data.expires_in*1000)));
  }

  async function getValidToken(){
    const token = localStorage.getItem(LS_TOKEN);
    const expires = Number(localStorage.getItem(LS_EXPIRES) || 0);
    if(token && Date.now() < expires - 30000){ return token; }
    const ok = await refreshToken();
    if(ok){ return localStorage.getItem(LS_TOKEN); }
    return null;
  }

  /* ---------------- handle redirect ---------------- */
  async function handleRedirect(){
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");
    if(code){
      try{
        await exchangeCodeForToken(code);
        window.history.replaceState({}, document.title, window.location.pathname);
      }catch(e){
        console.error(e);
        alert("Spotify sign-in failed. Check your Client ID and that the redirect URI is registered exactly.");
      }
    }
  }

  /* ---------------- app state ---------------- */
  let tracks = JSON.parse(localStorage.getItem(LS_TRACKS) || "[]");
  let playlistId = localStorage.getItem(LS_PLAYLIST_ID) || null;
  let player = null;
  let deviceId = null;
  let currentIndex = -1;
  let isPlaying = false;

  const titleInput = document.getElementById("tapeTitle");
  titleInput.value = localStorage.getItem(LS_TITLE) || "";
  titleInput.addEventListener("input", ()=>{
    localStorage.setItem(LS_TITLE, titleInput.value);
  });

  function renderTracks(){
    const el = document.getElementById("trackList");
    if(tracks.length === 0){
      el.innerHTML = '<div class="empty-tape">the tape is blank<br>hit record to lay down the first track</div>';
      document.getElementById("counter").textContent = "000";
      return;
    }
    el.innerHTML = tracks.map((t,i)=>`
      <div class="track-row">
        <span class="track-num">${String(i+1).padStart(2,"0")}</span>
        <div class="track-info">
          <div class="track-title">${escapeHtml(t.name)}</div>
          <div class="track-artist">${escapeHtml(t.artist)}</div>
        </div>
        <button class="track-remove" data-i="${i}">✕</button>
      </div>
    `).join("");
    document.getElementById("counter").textContent = String(tracks.length * 37).padStart(3,"0");
    el.querySelectorAll(".track-remove").forEach(btn=>{
      btn.addEventListener("click", (e)=>{
        const i = Number(e.currentTarget.dataset.i);
        tracks.splice(i,1);
        persistTracks();
        renderTracks();
      });
    });
  }
  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }
  function persistTracks(){
    localStorage.setItem(LS_TRACKS, JSON.stringify(tracks));
  }
  renderTracks();

  /* ---------------- search sheet ---------------- */
  const sheetBackdrop = document.getElementById("sheetBackdrop");
  const searchInput = document.getElementById("searchInput");
  const searchResults = document.getElementById("searchResults");
  let searchDebounce = null;

  document.getElementById("recordBtn").addEventListener("click", ()=>{
    sheetBackdrop.classList.add("open");
    searchInput.value = "";
    searchResults.innerHTML = "";
    setTimeout(()=>searchInput.focus(), 150);
    document.getElementById("recordBtn").classList.add("active");
  });
  document.getElementById("sheetClose").addEventListener("click", closeSheet);
  sheetBackdrop.addEventListener("click", (e)=>{ if(e.target === sheetBackdrop) closeSheet(); });
  function closeSheet(){
    sheetBackdrop.classList.remove("open");
    document.getElementById("recordBtn").classList.remove("active");
  }

  searchInput.addEventListener("input", ()=>{
    clearTimeout(searchDebounce);
    const q = searchInput.value.trim();
    if(!q){ searchResults.innerHTML = ""; return; }
    searchDebounce = setTimeout(()=>doSearch(q), 350);
  });

  async function doSearch(q){
    const token = await getValidToken();
    if(!token) return;
    const res = await fetch("https://api.spotify.com/v1/search?" + new URLSearchParams({q, type:"track", limit:12}), {
      headers: {"Authorization":"Bearer "+token}
    });
    if(!res.ok) return;
    const data = await res.json();
    const items = (data.tracks && data.tracks.items) || [];
    searchResults.innerHTML = items.map(t=>{
      const img = (t.album.images[t.album.images.length-1] || {}).url || "";
      return `
        <div class="result-row">
          <img src="${img}" alt="">
          <div class="result-info">
            <div class="result-title">${escapeHtml(t.name)}</div>
            <div class="result-artist">${escapeHtml(t.artists.map(a=>a.name).join(", "))}</div>
          </div>
          <button class="add-btn" data-uri="${t.uri}" data-name="${escapeHtml(t.name)}" data-artist="${escapeHtml(t.artists.map(a=>a.name).join(", "))}">+</button>
        </div>
      `;
    }).join("");
    searchResults.querySelectorAll(".add-btn").forEach(btn=>{
      btn.addEventListener("click", (e)=>{
        const uri = e.currentTarget.dataset.uri;
        const name = e.currentTarget.dataset.name;
        const artist = e.currentTarget.dataset.artist;
        tracks.push({uri, name, artist});
        persistTracks();
        renderTracks();
        addToSpotifyPlaylist(uri);
        closeSheet();
        flashReels();
      });
    });
  }

  function flashReels(){
    const l = document.getElementById("reelLeft");
    const r = document.getElementById("reelRight");
    l.classList.add("spin"); r.classList.add("spin");
    setTimeout(()=>{ if(!isPlaying){ l.classList.remove("spin"); r.classList.remove("spin"); } }, 1400);
  }

  /* ---------------- spotify playlist backing ---------------- */
  async function ensurePlaylist(){
    if(playlistId) return playlistId;
    const token = await getValidToken();
    if(!token) return null;
    const meRes = await fetch("https://api.spotify.com/v1/me", {headers:{Authorization:"Bearer "+token}});
    const me = await meRes.json();
    const title = titleInput.value.trim() || "My Mixtape";
    const res = await fetch(`https://api.spotify.com/v1/users/${me.id}/playlists`, {
      method:"POST",
      headers:{"Authorization":"Bearer "+token, "Content-Type":"application/json"},
      body: JSON.stringify({name: title, description:"Made in Mixtape 🎙️", public:false})
    });
    const data = await res.json();
    playlistId = data.id;
    localStorage.setItem(LS_PLAYLIST_ID, playlistId);
    return playlistId;
  }

  async function addToSpotifyPlaylist(uri){
    try{
      const id = await ensurePlaylist();
      if(!id) return;
      const token = await getValidToken();
      await fetch(`https://api.spotify.com/v1/playlists/${id}/tracks`, {
        method:"POST",
        headers:{"Authorization":"Bearer "+token, "Content-Type":"application/json"},
        body: JSON.stringify({uris:[uri]})
      });
    }catch(e){ console.error(e); }
  }

  /* ---------------- web playback sdk ---------------- */
  window.onSpotifyWebPlaybackSDKReady = async () => {
    const token = await getValidToken();
    if(!token) return;
    player = new Spotify.Player({
      name: "Mixtape Deck",
      getOAuthToken: cb => { getValidToken().then(t => cb(t)); },
      volume: 0.9
    });
    player.addListener("ready", ({device_id}) => { deviceId = device_id; });
    player.addListener("player_state_changed", state => {
      if(!state) return;
      isPlaying = !state.paused;
      updatePlayIcon();
      const reels = [document.getElementById("reelLeft"), document.getElementById("reelRight")];
      reels.forEach(r => r.classList.toggle("spin", isPlaying));
      const track = state.track_window.current_track;
      if(track){
        document.getElementById("nowPlaying").innerHTML =
          `now playing: <span class="track-name">${escapeHtml(track.name)}</span> — ${escapeHtml(track.artists.map(a=>a.name).join(", "))}`;
      }
    });
    player.connect();
  };
  function loadSpotifySDK(){
    if(document.getElementById("spotify-sdk")) return;
    const s = document.createElement("script");
    s.id = "spotify-sdk";
    s.src = "https://sdk.scdn.co/spotify-player.js";
    document.head.appendChild(s);
  }

  function updatePlayIcon(){
    document.getElementById("playBtn").textContent = isPlaying ? "⏸" : "▶";
  }

  async function playFromIndex(i){
    if(i<0 || i>=tracks.length || !deviceId) return;
    currentIndex = i;
    const token = await getValidToken();
    await fetch(`https://api.spotify.com/v1/me/player/play?device_id=${deviceId}`, {
      method:"PUT",
      headers:{"Authorization":"Bearer "+token, "Content-Type":"application/json"},
      body: JSON.stringify({uris:[tracks[i].uri]})
    });
  }

  document.getElementById("playBtn").addEventListener("click", async ()=>{
    if(!player) return;
    if(currentIndex === -1 && tracks.length){
      playFromIndex(0);
      return;
    }
    const state = await player.getCurrentState();
    if(!state){
      if(tracks.length) playFromIndex(0);
      return;
    }
    player.togglePlay();
  });
  document.getElementById("ffBtn").addEventListener("click", ()=>{
    if(currentIndex < tracks.length - 1){ playFromIndex(currentIndex + 1); }
  });
  document.getElementById("rewindBtn").addEventListener("click", ()=>{
    if(currentIndex > 0){ playFromIndex(currentIndex - 1); }
    else if(currentIndex === 0){ playFromIndex(0); }
  });

  /* ---------------- boot ---------------- */
  async function boot(){
    await handleRedirect();
    const token = await getValidToken();
    if(token){
      document.getElementById("loginCard").style.display = "none";
      document.getElementById("app").classList.add("open");
      loadSpotifySDK();
    } else {
      document.getElementById("loginCard").style.display = "block";
      document.getElementById("app").classList.remove("open");
    }
  }
  boot();

})();
</script>
</body>
</html>
